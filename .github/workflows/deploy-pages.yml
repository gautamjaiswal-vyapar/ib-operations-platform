name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          # The repository variable can override the endpoint for future deployments.
          # The fallback keeps GitHub Pages functional when the variable is not configured.
          NEXT_PUBLIC_APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL || 'https://script.google.com/macros/s/AKfycbwR6fmUEHwtHFM6qRNfNN5Im6opSgDtb1xI25cQFmzEP_e71sdebGuCtHf9CE63Py6SbQ/exec' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
