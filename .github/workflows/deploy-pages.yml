name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Check out reviewed IPT dashboard artifact
        uses: actions/checkout@v4
        with:
          ref: 0101a8ab3773386979570aadc04ddfa9665a0e3b
          path: .ipt-dashboard-artifact
          sparse-checkout: agent-performance-dashboard/dist
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          # The repository variable can override the endpoint for future deployments.
          # The fallback keeps GitHub Pages functional when the variable is not configured.
          NEXT_PUBLIC_APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL || 'https://script.google.com/macros/s/AKfycbwR6fmUEHwtHFM6qRNfNN5Im6opSgDtb1xI25cQFmzEP_e71sdebGuCtHf9CE63Py6SbQ/exec' }}
      - name: Add standalone IPT Agent Performance dashboard
        run: |
          set -euo pipefail
          dashboard_dir="apps/web/out/agent-performance"
          mkdir -p "$dashboard_dir"
          cp .ipt-dashboard-artifact/agent-performance-dashboard/dist/index.html "$dashboard_dir/index.html"
          cp .ipt-dashboard-artifact/agent-performance-dashboard/dist/data-app-build.json "$dashboard_dir/data-app-build.json"
          cp .ipt-dashboard-artifact/agent-performance-dashboard/dist/snapshot.d9a3e4fc171ee7e0c83aafea8600d4a5b2220ac2b7cee24d6771014fcc8205ed.json "$dashboard_dir/snapshot.d9a3e4fc171ee7e0c83aafea8600d4a5b2220ac2b7cee24d6771014fcc8205ed.json"
          cd "$dashboard_dir"
          printf '%s  %s\n' '271566c8c908a502c82b20502d06ad5b301a50e0d0f87da620d7b64f8e4b0cae' 'index.html' | sha256sum --check --strict
          printf '%s  %s\n' 'd9a3e4fc171ee7e0c83aafea8600d4a5b2220ac2b7cee24d6771014fcc8205ed' 'snapshot.d9a3e4fc171ee7e0c83aafea8600d4a5b2220ac2b7cee24d6771014fcc8205ed.json' | sha256sum --check --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
