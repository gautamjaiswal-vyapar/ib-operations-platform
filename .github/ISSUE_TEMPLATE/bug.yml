name: Bug report
description: Report a reproducible platform defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: impact
    attributes:
      label: Operational impact
      description: Explain who is affected and whether data correctness is at risk.
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the module, request or UI path, inputs, and observed result.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version or commit }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence
      description: Remove secrets, tokens, employee PII, and credentials before attaching logs.
