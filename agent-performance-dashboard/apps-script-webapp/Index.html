<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#071018;--surface:#0d1924;--raised:#142432;--control:#101f2b;--muted:#172633;--border:#29404f;--text:#f3f8fb;--secondary:#93a8b7;--accent:#58d6b4;--blue:#79a8ff;--positive:#55d88b;--negative:#ff7272;--warning:#f4b860}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}button,select{font:inherit}.page{width:min(1440px,100%);margin:auto;padding:20px 24px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}.brand h1{margin:0;font-size:22px}.brand p{margin:4px 0 0;color:var(--secondary)}.badge{padding:5px 10px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--border));border-radius:999px;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.08em}.filters{position:sticky;top:0;z-index:5;display:flex;align-items:end;flex-wrap:wrap;gap:10px;padding:14px;margin-bottom:16px;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px)}.field{display:grid;gap:5px;min-width:180px}.field label{color:var(--secondary);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}.field select{height:38px;padding:0 34px 0 11px;border:1px solid var(--border);border-radius:8px;background:var(--control);color:var(--text)}.segmented{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}.segmented button{height:38px;padding:0 18px;border:0;border-left:1px solid var(--border);background:var(--control);color:var(--secondary);cursor:pointer}.segmented button:first-child{border-left:0}.segmented button[aria-pressed=true]{background:var(--raised);color:var(--text);box-shadow:inset 0 -2px var(--accent)}.status{min-height:20px;margin:0 0 14px;color:var(--secondary)}.status[data-error=true]{color:var(--negative)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.card{min-width:0;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:18px}.metric-label{color:var(--secondary);font-weight:600}.metric-value{display:block;margin:10px 0 8px;font-size:34px;line-height:1;letter-spacing:-.04em}.delta{font-size:12px;font-weight:600}.delta[data-tone=positive]{color:var(--positive)}.delta[data-tone=negative]{color:var(--negative)}.delta[data-tone=neutral]{color:var(--secondary)}.analysis{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.75fr);gap:16px;margin-bottom:16px}.card h2{margin:0 0 4px;font-size:16px}.card .description{margin:0 0 16px;color:var(--secondary);font-size:12px}.chart-wrap{position:relative;height:310px}.metric-tabs{display:flex;gap:4px;margin-bottom:12px}.metric-tabs button{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--control);color:var(--secondary);cursor:pointer}.metric-tabs button[aria-pressed=true]{border-color:var(--accent);color:var(--text)}.funnel{display:grid;gap:16px}.funnel-line header{display:flex;justify-content:space-between}.track{height:12px;margin-top:6px;border-radius:4px;background:var(--muted);overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue))}.distribution{margin-top:16px}.table-wrap{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}.table th:first-child,.table td:first-child,.table th:nth-child(2),.table td:nth-child(2){text-align:left}.table th{position:sticky;top:0;background:var(--raised);color:var(--secondary);font-size:11px;text-transform:uppercase}.loading{opacity:.55;pointer-events:none}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.analysis{grid-template-columns:1fr}.page{padding-inline:14px}}@media(max-width:560px){.metrics{grid-template-columns:1fr}.filters{position:static}.field{width:100%}.segmented{width:100%}.segmented button{flex:1}.topbar{align-items:flex-start}.chart-wrap{height:260px}}
  </style>
</head>
<body>
  <main class="page" id="page">
    <header class="topbar"><div class="brand"><h1>IPT Agent Performance</h1><p id="subtitle">Loading access and historical periods…</p></div><span class="badge" id="role">—</span></header>
    <section class="filters" aria-label="Dashboard filters">
      <div class="segmented" role="group" aria-label="Period type">
        <button type="button" data-period="MONTH" aria-pressed="true">Month</button><button type="button" data-period="WEEK" aria-pressed="false">Week</button><button type="button" data-period="DAY" aria-pressed="false">Day</button>
      </div>
      <div class="field"><label for="period">Period</label><select id="period"></select></div>
      <div class="field" id="agent-field"><label for="agent">Agent or team</label><select id="agent"></select></div>
    </section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <section class="metrics" id="metrics"></section>
    <section class="analysis">
      <article class="card"><h2 id="history-title">Performance history</h2><p class="description">All available periods for the selected grain and access scope.</p><div class="metric-tabs" id="metric-tabs"></div><div class="chart-wrap"><canvas id="history-chart"></canvas></div></article>
      <article class="card"><h2>Selected-period funnel</h2><p class="description" id="funnel-description"></p><div class="funnel" id="funnel"></div></article>
    </section>
    <section class="card distribution"><h2>Agent distribution</h2><p class="description">Agents in the selected period and permitted team scope.</p><div class="table-wrap"><table class="table"><thead><tr><th>Agent</th><th>Team lead</th><th>Leads</th><th>Logins</th><th>Demos</th><th>Conversions</th></tr></thead><tbody id="distribution"></tbody></table></div></section>
  </main>
  <script>
    const state={bootstrap:null,periodType:'MONTH',selectedMetric:'conversions',chart:null};
    const metricDefinitions=[['leads','Leads'],['logins','Logins'],['demos','Demos'],['conversions','Conversions']];
    const number=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
    const dateFormat=new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
    document.addEventListener('DOMContentLoaded',()=>{bindControls();setBusy(true,'Loading dashboard…');google.script.run.withSuccessHandler(init).withFailureHandler(showError).getDashboardBootstrap();});
    function bindControls(){document.querySelectorAll('[data-period]').forEach(button=>button.addEventListener('click',()=>{state.periodType=button.dataset.period;document.querySelectorAll('[data-period]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));populatePeriods();loadData();}));document.getElementById('period').addEventListener('change',loadData);document.getElementById('agent').addEventListener('change',loadData);}
    function init(payload){state.bootstrap=payload;document.getElementById('role').textContent=payload.userRole;document.getElementById('subtitle').textContent=payload.userEmail;const agent=document.getElementById('agent');agent.innerHTML='';if(payload.userRole!=='AGENT')agent.add(new Option(payload.userRole==='TL'?'My team · aggregate':'All accessible agents · aggregate',''));payload.accessibleAgents.forEach(email=>agent.add(new Option(email,email)));agent.value=payload.defaultAgentEmail||'';document.getElementById('agent-field').hidden=payload.userRole==='AGENT';populatePeriods();buildMetricTabs();loadData();}
    function populatePeriods(){const select=document.getElementById('period');const periods=state.bootstrap?.periods?.[state.periodType]||[];select.innerHTML='';periods.forEach(period=>select.add(new Option(formatPeriod(state.periodType,period),period)));if(!periods.length)select.add(new Option('No periods available',''));}
    function loadData(){const period=document.getElementById('period').value;const agent=document.getElementById('agent').value;setBusy(true,'Updating dashboard…');google.script.run.withSuccessHandler(render).withFailureHandler(showError).getDashboardData(agent,state.periodType,period);}
    function render(payload){const updated=new Date(payload.generatedAt).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'});setBusy(false,`Latest data update: ${updated} IST · ${payload.cacheHit?'served from cache':'cache refreshed'}`);renderMetrics(payload);renderHistory(payload);renderFunnel(payload.metrics,payload);renderDistribution(payload.distribution);document.getElementById('subtitle').textContent=payload.isAggregate?`${payload.userRole} aggregate · ${formatPeriod(payload.periodType,payload.selectedPeriod)}`:`${payload.selectedAgentEmail} · ${formatPeriod(payload.periodType,payload.selectedPeriod)}`;}
    function renderMetrics(payload){const root=document.getElementById('metrics');root.innerHTML='';metricDefinitions.forEach(([key,label])=>{const actual=payload.metrics[key]||0;const previous=payload.previousMetrics?.[key];const change=previous>0?(actual-previous)/previous:null;const tone=change==null?'neutral':change>=0?'positive':'negative';const text=change==null?`Previous ${payload.periodType.toLowerCase()} unavailable`:`${change>=0?'▲':'▼'} ${Math.abs(change*100).toFixed(1)}% vs previous ${payload.periodType.toLowerCase()}`;root.insertAdjacentHTML('beforeend',`<article class="card"><span class="metric-label">${label}</span><strong class="metric-value">${number.format(actual)}</strong><span class="delta" data-tone="${tone}">${text}</span></article>`);});}
    function buildMetricTabs(){const root=document.getElementById('metric-tabs');metricDefinitions.forEach(([key,label])=>{const button=document.createElement('button');button.type='button';button.textContent=label;button.setAttribute('aria-pressed',String(key===state.selectedMetric));button.addEventListener('click',()=>{state.selectedMetric=key;root.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));loadData();});root.appendChild(button);});}
    function renderHistory(payload){document.getElementById('history-title').textContent=`${metricDefinitions.find(([key])=>key===state.selectedMetric)[1]} · ${payload.periodType.toLowerCase()} history`;const labels=payload.history.map(row=>formatPeriod(payload.periodType,row.period));const values=payload.history.map(row=>row[state.selectedMetric]||0);if(state.chart)state.chart.destroy();state.chart=new Chart(document.getElementById('history-chart'),{type:'line',data:{labels,datasets:[{label:state.selectedMetric,data:values,borderColor:'#58d6b4',backgroundColor:'rgba(88,214,180,.14)',fill:true,tension:.25,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#93a8b7',maxRotation:0,autoSkip:true,maxTicksLimit:10},grid:{color:'rgba(147,168,183,.08)'}},y:{beginAtZero:true,ticks:{color:'#93a8b7'},grid:{color:'rgba(147,168,183,.12)'}}}}});}
    function renderFunnel(metrics,payload){document.getElementById('funnel-description').textContent=formatPeriod(payload.periodType,payload.selectedPeriod);const max=Math.max(1,...metricDefinitions.map(([key])=>metrics[key]||0));document.getElementById('funnel').innerHTML=metricDefinitions.map(([key,label])=>`<div class="funnel-line"><header><span>${label}</span><strong>${number.format(metrics[key]||0)}</strong></header><div class="track"><i style="width:${Math.max(1,(metrics[key]||0)/max*100)}%"></i></div></div>`).join('');}
    function renderDistribution(rows){document.getElementById('distribution').innerHTML=rows.map(row=>`<tr><td>${escapeHtml(row.agentEmail)}</td><td>${escapeHtml(row.teamLead||'—')}</td><td>${number.format(row.leads)}</td><td>${number.format(row.logins)}</td><td>${number.format(row.demos)}</td><td>${number.format(row.conversions)}</td></tr>`).join('')||'<tr><td colspan="6">No agents found for this period.</td></tr>';}
    function formatPeriod(type,value){if(!value)return'No period';const date=new Date(`${value}T00:00:00Z`);if(type==='MONTH')return new Intl.DateTimeFormat('en-IN',{month:'long',year:'numeric',timeZone:'UTC'}).format(date);if(type==='WEEK')return`Week of ${dateFormat.format(date)}`;return dateFormat.format(date);}
    function setBusy(busy,message){document.getElementById('page').classList.toggle('loading',busy);const status=document.getElementById('status');status.dataset.error='false';status.textContent=message||'';}
    function showError(error){document.getElementById('page').classList.remove('loading');const status=document.getElementById('status');status.dataset.error='true';status.textContent=error?.message||String(error);}
    function escapeHtml(value){return String(value||'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));}
  </script>
</body>
</html>
